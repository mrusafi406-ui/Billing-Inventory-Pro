
name: Billing Inventory Pro Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: billing-inventory-pro-web
          path: dist/
          if-no-files-found: error
          retention-days: 7
