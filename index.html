<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123b35"><title>Billing & Inventory Pro</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#182b27;background:#f3f6f4;--green:#145c4b;--line:#dce5e0;--muted:#667870}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}header{background:linear-gradient(120deg,#123b35,#1d8065);color:white;padding:18px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:2}.brand{font-weight:800;font-size:18px}.sub{font-size:12px;opacity:.8}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 70px)}nav{background:#fff;border-right:1px solid var(--line);padding:12px}nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px;border-radius:10px;margin:3px 0;color:#26443a}nav button.active,nav button:hover{background:#e4f3ec;color:#145c4b;font-weight:700}main{padding:20px;max-width:1300px;width:100%;margin:auto}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 3px 12px #153d2c08}.metric{font-size:25px;font-weight:800;margin-top:8px}.muted{color:var(--muted);font-size:13px}.section{margin:18px 0}.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:white}button.primary{background:var(--green);color:white;border:0;border-radius:9px;padding:11px 16px;font-weight:700}button.secondary{background:#e4f3ec;color:#145c4b;border:0;border-radius:9px;padding:10px 14px;font-weight:700}table{border-collapse:collapse;width:100%;background:white}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{background:#f6f9f7;color:#52685d}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.notice{padding:12px;border-radius:10px;background:#fff5db;color:#71500a;margin:12px 0}.ok{background:#e4f3ec;color:#145c4b}.actions{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-block;padding:4px 8px;background:#e4f3ec;border-radius:99px;font-size:12px}.mobile-nav{display:none}h1{font-size:24px;margin:0 0 6px}h2{font-size:17px;margin:0 0 12px}@media(max-width:800px){.layout{display:block}nav{display:none}.mobile-nav{display:flex;gap:6px;overflow:auto;background:white;padding:8px;border-bottom:1px solid var(--line)}.mobile-nav button{white-space:nowrap;border:0;border-radius:8px;padding:9px;background:#edf3ef}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid{grid-template-columns:1fr 1fr}main{padding:13px}.desktop-only{display:none}}@media(max-width:440px){.formgrid{grid-template-columns:1fr}.metric{font-size:22px}}
</style></head><body><header><div><div class="brand">▣ Billing & Inventory Pro</div><div class="sub">Sales • Stock • Billing • Reports</div></div><div id="session" class="sub">Setup required</div></header><div id="mobileNav" class="mobile-nav"></div><div class="layout"><nav id="nav"></nav><main id="app"><div class="card"><h1>Billing & Inventory Pro</h1><p>Preparing workspace…</p></div></main></div><script type="module" src="/src/main.js"></script></body></html>
